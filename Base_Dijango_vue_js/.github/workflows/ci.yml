name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Base_dijango
    services:
      postgres:
        image: postgres:18.0-bookworm
        env:
          POSTGRES_DB: dijango_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dijango_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.2.1-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      JWT_SIGNING_KEY: ci-only-jwt-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dijango_ci
      REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_KEY_PREFIX: django_base_ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: Base_dijango/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --settings=config.settings.test
      - run: uv run python manage.py migrate --noinput --settings=config.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file schema.yml --settings=config.settings.test
      - run: git diff --exit-code -- schema.yml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
