[project]
name = "django-backend-base"
version = "0.1.0"
description = "Reusable modular Django REST backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "django>=5.2.12,<5.3",
  "django-cors-headers>=4.9.0,<5",
  "django-environ>=0.12.0,<1",
  "django-redis>=6.0.0,<7",
  "djangorestframework>=3.16.1,<3.17",
  "djangorestframework-simplejwt>=5.5.1,<6",
  "drf-spectacular>=0.29.0,<0.30",
  "gunicorn>=23.0.0,<24",
  "psycopg[binary]>=3.2.10,<4",
  "redis>=6.4.0,<7",
  "whitenoise>=6.11.0,<7",
]

[dependency-groups]
dev = [
  "factory-boy>=3.3.3,<4",
  "pytest>=8.4.2,<10",
  "pytest-cov>=7.0.0,<8",
  "pytest-django>=4.11.1,<5",
  "ruff>=0.13.2,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["apps", "common", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/*/migrations", ".tools", ".uv-cache*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
