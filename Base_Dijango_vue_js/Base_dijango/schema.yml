components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      - receive
      - inspect
      - prepare
      - complete
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
        * `receive` - receive
        * `inspect` - inspect
        * `prepare` - prepare
        * `complete` - complete
    AddCartItemInputRequest:
      type: object
      properties:
        variant:
          type: integer
        quantity:
